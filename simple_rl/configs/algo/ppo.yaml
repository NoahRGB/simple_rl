name: ppo

num_envs: 8
lr: 0.001
timesteps: 1_000_000
rollout_len: 32
epochs: 20 
minibatch_size: 256 
gamma: 0.98
lam: 0.8
epsilon: 0.2
entropy_weight: 0.0
value_weight: 0.5 
cgn: 0.5

architecture:
  actor_enc:
    - {type: linear, out: 64, act: tanh}
    - {type: linear, out: 64, act: tanh}
  value_enc:
    - {type: linear, out: 64, act: tanh}
    - {type: linear, out: 64, act: tanh}