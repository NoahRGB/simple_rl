defaults:
  - algo: ppo
  - env: gym
  - override hydra/job_logging: none
  - _self_

title: ???
notes: ???
seed: 0
device: cpu 

save_every: 50_000 # timesteps between checkpoints (only used if the algorithm has save_checkpoints: true)
load_dir: null # directory of a previous run to load a checkpoint from

hydra:
  run:
    dir: results/logs/${title}_${now:%Y%m%d_%H%M%S}
  job:
    chdir: false